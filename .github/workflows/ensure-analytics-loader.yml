name: Ensure analytics loader

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add analytics loader
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="/analytics.js" defer></script>'

          if tag not in text:
              marker = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
              if marker not in text:
                  raise SystemExit('Supabase script marker not found')
              text = text.replace(marker, marker + '\n    ' + tag, 1)
              path.write_text(text, encoding='utf-8')
          else:
              print('Analytics loader already present')

      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load analytics.js directly from index'
          git push
