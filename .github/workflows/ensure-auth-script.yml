name: Ensure auth script is loaded

on:
  push:
    branches:
      - feature/owner-seller-shared-shop-implementation

permissions:
  contents: write

jobs:
  ensure-auth-script:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Inject auth script if missing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="/auth-supabase.js" defer></script>'
          if tag not in s:
              marker = '<script src="/analytics.js" defer></script>'
              if marker not in s:
                  raise SystemExit('analytics script marker not found')
              s = s.replace(marker, marker + '\n    ' + tag, 1)
              p.write_text(s, encoding='utf-8')
              print('Auth script injected.')
          else:
              print('Auth script already present.')
          PY

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix auth script loading"
          git push
