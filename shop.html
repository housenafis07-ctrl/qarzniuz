ble{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}.table th{color:#475569;background:#f8fafc}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.bad{background:#fee2e2;color:#991b1b}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px}.loginbox h1{margin-top:0}.mobileTop{display:none}.mobileNav{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:20}@media(max-width:850px){.side{display:none}.main{margin:0;width:100%;padding:12px;padding-bottom:28px}.mobileTop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;position:sticky;top:0;background:var(--bg);z-index:10;padding:4px 0}.mobileNav{display:block;margin-bottom:10px}.mobileNav select{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-weight:700;color:#172033}.top{display:none}.grid{grid-template-columns:repeat(2,1fr)}.card{padding:14px}.tablewrap{margin:0 -2px}.table{min-width:680px}.btn{padding:10px 12px}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:13px}.stat b{font-size:18px}.field{min-width:100%}.mobileTop .btn{padding:8px 10px;font-size:12px}.loginbox{padding:20px}.row>.btn{width:100%}.tablewrap{width:100%;overflow:visible}.table{min-width:0!important;width:100%;display:block;font-size:12px}.table thead{display:none}.table tbody,.table tr{display:block;width:100%}.table tr{background:#fff;border:1px solid var(--line);border-radius:10px;margin:0 0 9px;padding:5px 8px}.table th{display:none}.table td{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;width:100%;padding:8px 2px;border-bottom:1px solid #eef2f7;white-space:normal;word-break:break-word;text-align:right}.table td:last-child{border-bottom:0}.table td::before{font-weight:700;color:#64748b;text-align:left;flex:0 0 42%;content:""}.dashboard-table td:nth-child(1)::before{content:"Vaqt"}.dashboard-table td:nth-child(2)::before{content:"Tur"}.dashboard-table td:nth-child(3)::before{content:"Mijoz"}.dashboard-table td:nth-child(4)::before{content:"Сумма"}.dashboard-table td:nth-child(5)::before{content:"Kim"}.customers-table td:nth-child(1)::before{content:"Mijoz"}.customers-table td:nth-child(2)::before{content:"Telefon"}.customers-table td:nth-child(3)::before{content:"Qarz"}.customers-table td:nth-child(4)::before{content:"To‘langan"}.customers-table td:nth-child(5)::before{content:"Qoldiq"}.customers-table td:nth-child(6)::before{content:"Kim qo‘shgan"}.customers-table td:nth-child(7)::before{content:"Amal"}.debts-table td:nth-child(1)::before{content:"Sana"}.debts-table td:nth-child(2)::before{content:"Mijoz"}.debts-table td:nth-child(3)::before{content:"Summa"}.debts-table td:nth-child(4)::before{content:"Muddat"}.debts-table td:nth-child(5)::before{content:"Kim"}.debts-table td:nth-child(6)::before{content:"Status"}.payments-table td:nth-child(1)::before{content:"Sana"}.payments-table td:nth-child(2)::before{content:"Mijoz"}.payments-table td:nth-child(3)::before{content:"Summa"}.payments-table td:nth-child(4)::before{content:"Kim"}.payments-table td:nth-child(5)::before{content:"Status"}.payments-table td:nth-child(6)::before{content:"Amal"}.sellers-table td:nth-child(1)::before{content:"Sotuvchi"}.sellers-table td:nth-child(2)::before{content:"Telefon"}.sellers-table td:nth-child(3)::before{content:"Holat"}.sellers-table td:nth-child(4)::before{content:"Auth"}.sellers-table td:nth-child(5)::before{content:"Amal"}.activity-table td:nth-child(1)::before{content:"Vaqt"}.activity-table td:nth-child(2)::before{content:"Amal"}.activity-table td:nth-child(3)::before{content:"Tur"}.activity-table td:nth-child(4)::before{content:"ID"}.reports-table td:nth-child(1)::before{content:"Sotuvchi"}.reports-table td:nth-child(2)::before{content:"Qarzlar"}.reports-table td:nth-child(3)::before{content:"Qarz summasi"}.reports-table td:nth-child(4)::before{content:"To‘lovlar"}.reports-table td:nth-child(5)::before{content:"To‘lov summasi"}.audit-table td:nth-child(1)::before{content:"Vaqt"}.audit-table td:nth-child(2)::before{content:"Kim"}.audit-table td:nth-child(3)::before{content:"Amal"}.audit-table td:nth-child(4)::before{content:"Entity"}.audit-table td:nth-child(5)::before{content:"ID"}}</style>

<body>
<div id="login" class="login hidden"><div class="loginbox"><h1>QarzniUz</h1><p class="muted">Do‘kon boshqaruv paneli uchun avval QarzniUz ilovasiga kiring.</p><button class="btn" onclick="returnToMainApp()">Asosiy ilovaga qaytish</button></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand">QarzniUz</div><div id="shopmini" class="shopmini"></div><div id="nav" class="nav"></div><button class="btn light" style="width:100%;margin-top:20px" onclick="returnToMainApp()">← Asosiy ilova</button></aside><main class="main"><div class="mobileTop"><b>QarzniUz</b><div style="display:flex;gap:6px"><button class="btn light" onclick="toggleShopLanguage()">🌐</button><button class="btn light" onclick="returnToMainApp()">Asosiy ilova</button></div></div><div id="mobileNav" class="mobileNav"></div><div class="top"><div><h1 id="title">Dashboard</h1><div class="muted" id="shop-subtitle">Bitta do‘kon — barcha sotuvchilar uchun bitta umumiy daftar</div></div><div style="display:flex;align-items:center;gap:8px"><button class="btn light" onclick="toggleShopLanguage()">🌐</button><span class="role" id="role"></span></div></div><section id="view"></section></main></div><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://yzicsoyufdghwiezqjsa.supabase.co',SUPABASE_ANON_KEY='sb_publishable_nneWyKMepgYOVpn8fVXwMA_4m98kinM';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});let ctx=null,data={customers:[],debts:[],payments:[],members:[]},current='dashboard';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>new Intl.NumberFormat('uz-UZ').format(Number(n||0))+' so‘m',customerName=id=>data.customers.find(x=>x.id===id)?.full_name||'—';
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>e.style.display='none',2600)}
async function api(path,body){
  let {data:{session}}=await sb.auth.getSession();
  if(!session)throw Error('Sessiya topilmadi. Asosiy ilovaga qaytib qayta kiring.');
  const request=async(s)=>{
    const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token},body:body?JSON.stringify(body):undefined,cache:'no-store'});
    const j=await r.json().catch(()=>({}));
    return {r,j};
  };
  let {r,j}=await request(session);
  if(r.status===401){
    const refreshed=await sb.auth.refreshSession();
    session=refreshed.data?.session||null;
    if(session)({r,j}=await request(session));
  }
  if(!r.ok||!j.ok){
    const msg=j.error||('Server xatosi ('+r.status+')');
    throw Error(msg);
  }
  return j.data;
}
async function returnToMainApp(){
  // Keep the newest in-memory session so the Telegram Mini App does not come
  // back with an old refresh token after the shop panel refreshed the session.
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session?.access_token) sessionStorage.setItem('qz_telegram_session',JSON.stringify(session));
  }catch(e){console.warn('main app session handoff:',e)}
  sessionStorage.setItem('qarzniuz_return_main','1');
  window.location.assign('/?main=1&from=shop');
}
async function start(){
  // Supabase keeps its auth session for token refresh, but QarzniUz requires a
  // fresh PIN unlock when the app/tab is opened again. sessionStorage is cleared
  // when the browsing session ends, so a persisted Supabase token cannot by itself
  // open the shop panel.
  const pinUnlocked=sessionStorage.getItem('qarzniuz_pin_unlocked')==='1';
  let {data:{session}}=await sb.auth.getSession();
  if(!session){
    try{
      const raw=sessionStorage.getItem('qarzniuz_shop_session');
      if(raw){
        const saved=JSON.parse(raw);
        if(saved?.access_token){
          const set=await sb.auth.setSession({access_token:saved.access_token,refresh_token:saved.refresh_token||''});
          session=set.data?.session||null;
          if(session)sessionStorage.removeItem('qarzniuz_shop_session');
        }
      }
    }catch(e){console.warn('shop session handoff:',e)}
  }
  if(!session || !pinUnlocked){document.getElementById('login').classList.remove('hidden');return}
  try{
    ctx=await api('/api/shop?action=bootstrap');
    // Sellers never use the shop-management panel. If a seller reaches this
    // URL directly or from an old cached route, send them to the main app.
    if(String(ctx.member?.role||'').toUpperCase()==='SELLER'){
      window.location.replace('/?main=1&from=shop');
      return;
    }
    await migrateLegacyData();
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('shopmini').innerHTML='<b>'+esc(ctx.shop.name)+'</b><br><span style="color:#94a3b8">'+esc(ctx.member.full_name)+' · '+ctx.member.role+'</span>';
    document.getElementById('role').textContent=ctx.member.role==='OWNER'?'OWNER — EGASI':'SELLER — SOTUVCHI';
    localStorage.setItem('qarzniuz_shop_role',ctx.member.role);
    localStorage.setItem('qarzniuz_shop_role_phone',ctx.user.phone||'');
    buildNav();
    await loadData();
    show(ctx.member.role==='OWNER'?'dashboard':'customers');
  }catch(e){
    console.error('Shop panel bootstrap failed:',e);
    const login=document.getElementById('login');
    if(login){
      login.classList.remove('hidden');
      const box=login.querySelector('p');
      if(box) box.innerHTML='<b>Do‘kon paneli ochilmadi.</b><br><span style="color:#b91c1c">'+esc(e?.message||'Noma’lum server xatosi')+'</span><br><button class="btn" style="margin-top:12px" onclick="location.href=\'/shop.html?retry=1\'">Qayta urinish</button>';
    }
    toast(e?.message||'Do‘kon panelini ochib bo‘lmadi');
  }}
function buildNav(){
  let a=[];
  if(ctx.member.role==='OWNER'){
    a=[['dashboard','Dashboard'],['customers','Mijozlar'],['debts','Qarzdorlar'],['payments','To‘lovlar'],['sellers','Sotuvchilar'],['reports','Hisobotlar'],['audit','Audit tarixi'],['settings','Sozlamalar']];
  }else{
    // Seller has no Dashboard at all. Only shared-shop operational sections.
    a=[['customers','Mijozlar'],['debts','Qarzdorlar'],['payments','To‘lovlar'],['activity','Mening faoliyatim']];
  }
  document.getElementById('nav').innerHTML=a.map(x=>'<button id="n-'+x[0]+'" onclick="show(\''+x[0]+'\')">'+x[1]+'</button>').join('');
  document.getElementById('mobileNav').innerHTML='<select aria-label="Bo‘lim" onchange="show(this.value)">'+a.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select>';
}
async function migrateLegacyData(){
  if(!ctx?.user?.id)return false;
  const marker='qarzniuz_legacy_imported_'+ctx.user.id;
  if(localStorage.getItem(marker)==='1')return false;
  const phone=String(ctx.user.phone||'').replace(/\D/g,'');
  if(!phone)return false;
  let legacy=null;
  try{legacy=JSON.parse(localStorage.getItem('shop_debts_'+phone)||'null')}catch(_){legacy=null}
  if(!Array.isArray(legacy)||!legacy.length){localStorage.setItem(marker,'1');return false}
  // Legacy data belongs to the old per-phone browser store. Import it only when
  // the shared shop is still empty; another seller must never be blocked because
  // the Owner (or another seller) has already populated the shared database.
  if(Number(ctx.dashboard?.customers||0)>0){
    localStorage.setItem(marker,'1');
    return false;
  }
  try{
    const result=await api('/api/shop',{action:'legacy_import',customers:legacy});
    localStorage.setItem(marker,'1');
    toast(result.imported+' ta eski mijoz ma\'lumoti yangi tizimga ko\'chirildi');
    return true;
  }catch(e){
    const msg=String(e?.message||'');
    if(/allaqachon yangi ma'lumotlar mavjud/i.test(msg)){
      localStorage.setItem(marker,'1');
      return false;
    }
    throw e;
  }
}
async function loadData(){data=await api('/api/shop?action=data')}
function activeNav(){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById('n-'+current)?.classList.add('active')}
async function show(v){if(ctx?.member?.role!=='OWNER'&&v==='dashboard'){v='customers'}if(ctx?.member?.role!=='OWNER'&&['sellers','reports','audit','settings'].includes(v)){toast('Bu bo‘lim faqat do‘kon egasi uchun');return}current=v;activeNav();const mobile=document.querySelector('#mobileNav select');if(mobile)mobile.value=v;document.getElementById('title').textContent={dashboard:'Dashboard',customers:'Mijozlar',debts:'Qarzdorlar',payments:'To‘lovlar',sellers:'Sotuvchilar',reports:'Hisobotlar',audit:'Audit tarixi',settings:'Sozlamalar',activity:'Mening faoliyatim'}[v]||v;try{if(v==='dashboard')renderDashboard();if(v==='customers')renderCustomers();if(v==='debts')renderDebts();if(v==='payments')renderPayments();if(v==='sellers')renderSellers();if(v==='reports')await renderReports();if(v==='audit')await renderAudit();if(v==='settings')renderSettings();if(v==='activity')await renderActivity();applyShopLanguage()}catch(e){toast(e.message)}}
function renderDashboard(){const d=data.debts.filter(x=>x.status==='active'),p=data.payments.filter(x=>x.status==='recorded'),debt=d.reduce((s,x)=>s+Number(x.amount),0),paid=p.reduce((s,x)=>s+Number(x.amount),0);document.getElementById('view').innerHTML='<div class="grid"><div class="stat"><span class="muted">Mijozlar</span><b>'+data.customers.length+'</b></div><div class="stat"><span class="muted">Faol qarzdorlar</span><b>'+data.customers.filter(x=>Number(x.balance)>0.009).length+'</b></div><div class="stat"><span class="muted">Jami qarz</span><b>'+money(debt)+'</b></div><div class="stat"><span class="muted">Qoldiq qarz</span><b>'+money(debt-paid)+'</b></div></div><div class="card"><h3>Tezkor amallar</h3><div class="row"><button class="btn" onclick="show(\'customers\')">+ Mijoz</button><button class="btn" onclick="show(\'debts\')">+ Qarz</button><button class="btn ok" onclick="show(\'payments\')">+ To‘lov</button></div></div><div class="card"><h3>Oxirgi amallar</h3><table class="table dashboard-table"><tr><th>Vaqt</th><th>Tur</th><th>Mijoz</th><th>Summa</th><th>Kim</th></tr>'+[...d.slice(0,5).map(x=>['Qarz',x]),...p.slice(0,5).map(x=>['To‘lov',x])].sort((a,b)=>String(b[1].created_at).localeCompare(String(a[1].created_at))).slice(0,8).map(a=>'<tr><td>'+esc(new Date(a[1].created_at).toLocaleString('uz-UZ'))+'</td><td>'+a[0]+'</td><td>'+esc(customerName(a[1].customer_id))+'</td><td>'+money(a[1].amount)+'</td><td>'+esc(a[1].created_by_name)+'</td></tr>').join('')+'</table></div>'}
function renderCustomers(){document.getElementById('view').innerHTML='<div class="card"><div class="row"><div class="field"><label>Mijoz ismi</label><input id="cn" placeholder="Masalan: Ali Valiyev"></div><div class="field"><label>Telefon</label><input id="cp" placeholder="+998901234567"></div><div class="field"><label>Izoh</label><input id="cm" placeholder="Izoh"></div><button class="btn" onclick="createCustomer()">+ Qo‘shish</button></div></div><div class="card"><div class="tablewrap"><table class="table customers-table"><tr><th>Mijoz</th><th>Telefon</th><th>Qarz</th><th>To‘langan</th><th>Qoldiq</th><th>Kim qo‘shgan</th><th></th></tr>'+data.customers.map(c=>'<tr><td><b>'+esc(c.full_name)+'</b><br><span class="muted">'+esc(c.note||'')+'</span></td><td>'+esc(c.phone||'—')+'</td><td>'+money(c.total_debt)+'</td><td>'+money(c.total_paid)+'</td><td><b>'+money(c.balance)+'</b></td><td>'+esc(c.created_by_name)+'</td><td>'+(ctx.member.role==='OWNER'&&c.status==='active'?'<button class="btn light" onclick="archiveCustomer(\''+c.id+'\')">Arxiv</button>':'')+'</td></tr>').join('')+'</table></div></div>'}
async function createCustomer(){try{await api('/api/shop',{action:'customer_create',full_name:document.getElementById('cn').value,phone:document.getElementById('cp').value,note:document.getElementById('cm').value});toast('Mijoz qo‘shildi');await loadData();renderCustomers()}catch(e){toast(e.message)}}
async function archiveCustomer(id){if(!confirm('Mijozni arxivlaysizmi? Tarix o‘chmaydi.'))return;try{await api('/api/shop',{action:'customer_archive',customer_id:id});await loadData();renderCustomers();toast('Mijoz arxivlandi')}catch(e){toast(e.message)}}
function renderDebts(){document.getElementById('view').innerHTML='<div class="card"><div class="row"><div class="field"><label>Mijoz</label><select id="dc">'+data.customers.filter(c=>c.status==='active').map(c=>'<option value="'+c.id+'">'+esc(c.full_name)+' — '+money(c.balance)+'</option>').join('')+'</select></div><div class="field"><label>Qarz summasi</label><input id="da" type="number" min="1" placeholder="500000"></div><div class="field"><label>Muddat</label><input id="dd" type="date"></div><div class="field"><label>Izoh</label><input id="dn" placeholder="Tovar, sana..."></div><button class="btn" onclick="createDebt()">+ Qarz</button></div></div><div class="card"><div class="tablewrap"><table class="table debts-table"><tr><th>Sana</th><th>Mijoz</th><th>Summa</th><th>Muddat</th><th>Kim</th><th>Status</th></tr>'+data.debts.map(d=>'<tr><td>'+esc(new Date(d.created_at).toLocaleString('uz-UZ'))+'</td><td>'+esc(customerName(d.customer_id))+'</td><td>'+money(d.amount)+'</td><td>'+esc(d.due_date||'—')+'</td><td>'+esc(d.created_by_name)+'</td><td><span class="pill '+(d.status==='active'?'warn':'bad')+'">'+d.status+'</span></td></tr>').join('')+'</table></div></div>'}

function renderPayments(){document.getElementById('view').innerHTML='<div class="card"><div class="row"><div class="field"><label>Mijoz</label><select id="pc">'+data.customers.filter(c=>c.status==='active').map(c=>'<option value="'+c.id+'">'+esc(c.full_name)+' — '+money(c.balance)+'</option>').join('')+'</select></div><div class="field"><label>To‘lov summasi</label><input id="pa" type="number" min="1" placeholder="300000"></div><div class="field"><label>Izoh</label><input id="pn" placeholder="Naqd, karta..."></div><button class="btn ok" onclick="createPayment()">+ To‘lov</button></div></div><div class="card"><div class="tablewrap"><table class="table payments-table"><tr><th>Sana</th><th>Mijoz</th><th>Summa</th><th>Kim</th><th>Status</th><th></th></tr>'+data.payments.map(p=>'<tr><td>'+esc(new Date(p.created_at).toLocaleString('uz-UZ'))+'</td><td>'+esc(customerName(p.customer_id))+'</td><td>'+money(p.amount)+'</td><td>'+esc(p.created_by_name)+'</td><td><span class="pill '+(p.status==='recorded'?'ok':'bad')+'">'+p.status+'</span></td><td>'+(ctx.member.role==='OWNER'&&p.status==='recorded'?'<button class="btn light" onclick="cancelPayment(\''+p.id+'\')">Bekor qilish</button>':'')+'</td></tr>').join('')+'</table></div></div>'}
