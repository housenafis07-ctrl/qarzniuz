ble{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}.table th{color:#475569;background:#f8fafc}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.bad{background:#fee2e2;color:#991b1b}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px}.loginbox h1{margin-top:0}.mobileTop{display:none}.mobileNav{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:20}@media(max-width:850px){.side{display:none}.main{margin:0;width:100%;padding:12px;padding-bottom:28px}.mobileTop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;position:sticky;top:0;background:var(--bg);z-index:10;padding:4px 0}.mobileNav{display:block;margin-bottom:10px}.mobileNav select{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-weight:700;color:#172033}.top{display:none}.grid{grid-template-columns:repeat(2,1fr)}.card{padding:14px}.tablewrap{margin:0 -2px}.table{min-width:680px}.btn{padding:10px 12px}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:13px}.stat b{font-size:18px}.field{min-width:100%}.mobileTop .btn{padding:8px 10px;font-size:12px}.loginbox{padding:20px}.row>.btn{width:100%}}
</style>

<body>
<div id="login" class="login hidden"><div class="loginbox"><h1>QarzniUz</h1><p class="muted">Do‘kon boshqaruv paneli uchun avval QarzniUz ilovasiga kiring.</p><button class="btn" onclick="location.href='/'">Asosiy ilovaga qaytish</button></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand">QarzniUz</div><div id="shopmini" class="shopmini"></div><div id="nav" class="nav"></div><button class="btn light" style="width:100%;margin-top:20px" onclick="location.href='/'">← Asosiy ilova</button></aside><main class="main"><div class="mobileTop"><b>QarzniUz</b><button class="btn light" onclick="location.href='/'">Asosiy ilova</button></div><div id="mobileNav" class="mobileNav"></div><div class="top"><div><h1 id="title">Dashboard</h1><div class="muted">Bitta do‘kon — barcha sotuvchilar uchun bitta umumiy daftar</div></div><span class="role" id="role"></span></div><section id="view"></section></main></div><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://yzicsoyufdghwiezqjsa.supabase.co',SUPABASE_ANON_KEY='sb_publishable_nneWyKMepgYOVpn8fVXwMA_4m98kinM';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});let ctx=null,data={customers:[],debts:[],payments:[],members:[]},current='dashboard';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>new Intl.NumberFormat('uz-UZ').format(Number(n||0))+' so‘m',customerName=id=>data.customers.find(x=>x.id===id)?.full_name||'—';
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>e.style.display='none',2600)}
async function api(path,body){
  let {data:{session}}=await sb.auth.getSession();
  if(!session)throw Error('Sessiya topilmadi. Asosiy ilovaga qaytib qayta kiring.');
  const request=async(s)=>{
    const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token},body:body?JSON.stringify(body):undefined,cache:'no-store'});
    const j=await r.json().catch(()=>({}));
    return {r,j};
  };
  let {r,j}=await request(session);
  if(r.status===401){
    const refreshed=await sb.auth.refreshSession();
    session=refreshed.data?.session||null;
    if(session)({r,j}=await request(session));
  }
  if(!r.ok||!j.ok){
    const msg=j.error||('Server xatosi ('+r.status+')');
    throw Error(msg);
  }
  return j.data;
}
async function start(){
  let {data:{session}}=await sb.auth.getSession();
  if(!session){
    try{
      const raw=sessionStorage.getItem('qarzniuz_shop_session');
      if(raw){
        const saved=JSON.parse(raw);
        if(saved?.access_token){
          const set=await sb.auth.setSession({access_token:saved.access_token,refresh_token:saved.refresh_token||''});
          session=set.data?.session||null;
          if(session)sessionStorage.removeItem('qarzniuz_shop_session');
        }
      }
    }catch(e){console.warn('shop session handoff:',e)}
  }
  if(!session){document.getElementById('login').classList.remove('hidden');return}
  try{
    ctx=await api('/api/shop?action=bootstrap');
    await migrateLegacyData();
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('shopmini').innerHTML='<b>'+esc(ctx.shop.name)+'</b><br><span style="color:#94a3b8">'+esc(ctx.member.full_name)+' · '+ctx.member.role+'</span>';
    document.getElementById('role').textContent=ctx.member.role==='OWNER'?'OWNER — EGASI':'SELLER — SOTUVCHI';
    localStorage.setItem('qarzniuz_shop_role',ctx.member.role);
    localStorage.setItem('qarzniuz_shop_role_phone',ctx.user.phone||'');
    buildNav();
    await loadData();
    show(ctx.member.role==='OWNER'?'dashboard':'customers');
  }catch(e){
    console.error('Shop panel bootstrap failed:',e);
    const login=document.getElementById('login');
    if(login){
      login.classList.remove('hidden');
      const box=login.querySelector('p');
      if(box) box.innerHTML='<b>Do‘kon paneli ochilmadi.</b><br><span style="color:#b91c1c">'+esc(e?.message||'Noma’lum server xatosi')+'</span><br><button class="btn" style="margin-top:12px" onclick="location.href=\'/shop.html?retry=1\'">Qayta urinish</button>';
    }
    toast(e?.message||'Do‘kon panelini ochib bo‘lmadi');
  }}
function buildNav(){
  let a=[];
  if(ctx.member.role==='OWNER'){
    a=[['dashboard','Dashboard'],['customers','Mijozlar'],['debts','Qarzdorlar'],['payments','To‘lovlar'],['sellers','Sotuvchilar'],['reports','Hisobotlar'],['audit','Audit tarixi'],['export','Export / Backup'],['settings','Sozlamalar']];
  }else{
    // Seller does not need a dashboard or legacy "Asosiy ilova" entry.
    // They work directly with the shared shop ledger.
    a=[['customers','Mijozlar'],['debts','Qarzdorlar'],['payments','To‘lovlar'],['activity','Mening faoliyatim']];
  }
  document.getElementById('nav').innerHTML=a.map(x=>'<button id="n-'+x[0]+'" onclick="show(\''+x[0]+'\')">'+x[1]+'</button>').join('');
  document.getElementById('mobileNav').innerHTML='<select aria-label="Bo‘lim" onchange="show(this.value)">'+a.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select>';
}
async function migrateLegacyData(){
  if(!ctx?.user?.id)return false;
  const marker='qarzniuz_legacy_imported_'+ctx.user.id;
  if(localStorage.getItem(marker)==='1')return false;
  const phone=String(ctx.user.phone||'').replace(/\D/g,'');
  if(!phone)return false;
  let legacy=null;
  try{legacy=JSON.parse(localStorage.getItem('shop_debts_'+phone)||'null')}catch(_){legacy=null}
  if(!Array.isArray(legacy)||!legacy.length){localStorage.setItem(marker,'1');return false}
  // Legacy data belongs to the old per-phone browser store. Import it only when
  // the shared shop is still empty; another seller must never be blocked because
  // the Owner (or another seller) has already populated the shared database.
  if(Number(ctx.dashboard?.customers||0)>0){
    localStorage.setItem(marker,'1');
    return false;
  }
  try{
    const result=await api('/api/shop',{action:'legacy_import',customers:legacy});
    localStorage.setItem(marker,'1');
    toast(result.imported+' ta eski mijoz ma\'lumoti yangi tizimga ko\'chirildi');
    return true;
  }catch(e){
    const msg=String(e?.message||'');
    if(/allaqachon yangi ma'lumotlar mavjud/i.test(msg)){
      localStorage.setItem(marker,'1');
      return false;
    }
    throw e;
  }
}
async function loadData(){data=await api('/api/shop?action=data')}
function activeNav(){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById('n-'+current)?.classList.add('active')}
async function show(v){if(ctx?.member?.role!=='OWNER'&&['sellers','reports','audit','export','settings'].includes(v)){toast('Bu bo‘lim faqat do‘kon egasi uchun');return}current=v;activeNav();const mobile=document.querySelector('#mobileNav select');if(mobile)mobile.value=v;document.getElementById('title').textContent={dashboard:'Dashboard',customers:'Mijozlar',debts:'Qarzdorlar',payments:'To‘lovlar',sellers:'Sotuvchilar',reports:'Hisobotlar',audit:'Audit tarixi',export:'Export / Backup',settings:'Sozlamalar',activity:'Mening faoliyatim'}[v]||v;try{if(v==='dashboard')renderDashboard();if(v==='customers')renderCustomers();if(v==='debts')renderDebts();if(v==='payments')renderPayments();if(v==='sellers')renderSellers();if(v==='reports')await renderReports();if(v==='audit')await renderAudit();if(v==='export')renderExport();if(v==='settings')renderSettings();if(v==='activity')await renderActivity()}catch(e){toast(e.message)}}
function renderDashboard(){const d=data.debts.filter(x=>x.status==='active'),p=data.payments.filter(x=>x.status==='recorded'),debt=d.reduce((s,x)=>s+Number(x.amount),0),paid=p.reduce((s,x)=>s+Number(x.amount),0);document.getElementById('view').innerHTML='<div class="grid"><div class="stat"><span class="muted">Mijozlar</span><b>'+data.customers.length+'</b></div><div class="stat"><span class="muted">Faol qarzdorlar</span><b>'+data.customers.filter(x=>Number(x.balance)>0.009).length+'</b></div><div class="stat"><span class="muted">Jami qarz</span><b>'+money(debt)+'</b></div><div class="stat"><span class="muted">Qoldiq qarz</span><b>'+money(debt-paid)+'</b></div></div><div class="card"><h3>Tezkor amallar</h3><div class="row"><button class="btn" onclick="show(\'customers\')">+ Mijoz</button><button class="btn" onclick="show(\'debts\')">+ Qarz</button><button class="btn ok" onclick="show(\'payments\')">+ To‘lov</button></div></div><div class="card"><h3>Oxirgi amallar</h3><table class="table"><tr><th>Vaqt</th><th>Tur</th><th>Mijoz</th><th>Summa</th><th>Kim</th></tr>'+[...d.slice(0,5).map(x=>['Qarz',x]),...p.slice(0,5).map(x=>['To‘lov',x])].sort((a,b)=>String(b[1].created_at).localeCompare(String(a[1].created_at))).slice(0,8).map(a=>'<tr><td>'+esc(new Date(a[1].created_at).toLocaleString('uz-UZ'))+'</td><td>'+a[0]+'</td><td>'+esc(customerName(a[1].customer_id))+'</td><td>'+money(a[1].amount)+'</td><td>'+esc(a[1].created_by_name)+'</td></tr>').join('')+'</table></div>'}
function renderCustomers(){document.getElementById('view').innerHTML='<div class="card"><div class="row"><div class="field"><label>Mijoz ismi</label><input id="cn" placeholder="Masalan: Ali Valiyev"></div><div class="field"><label>Telefon</label><input id="cp" placeholder="+998901234567"></div><div class="field"><label>Izoh</label><input id="cm" placeholder="Izoh"></div><button class="btn" onclick="createCustomer()">+ Qo‘shish</button></div></div><div class="card"><div class="tablewrap"><table class="table"><tr><th>Mijoz</th><th>Telefon</th><th>Qarz</th><th>To‘langan</th><th>Qoldiq</th><th>Kim qo‘shgan</th><th></th></tr>'+data.customers.map(c=>'<tr><td><b>'+esc(c.full_name)+'</b><br><span class="muted">'+esc(c.note||'')+'</span></td><td>'+esc(c.phone||'—')+'</td><td>'+money(c.total_debt)+'</td><td>'+money(c.total_paid)+'</td><td><b>'+money(c.balance)+'</b></td><td>'+esc(c.created_by_name)+'</td><td>'+(ctx.member.role==='OWNER'&&c.status==='active'?'<button class="btn light" onclick="archiveCustomer(\''+c.id+'\')">Arxiv</button>':'')+'</td></tr>').join('')+'</table></div></div>'}
async function createCustomer(){try{await api('/api/shop',{action:'customer_create',full_name:document.getElementById('cn').value,phone:document.getElementById('cp').value,note:document.getElementById('cm').value});toast('Mijoz qo‘shildi');await loadData();renderCustomers()}catch(e){toast(e.message)}}
async function archiveCustomer(id){if(!confirm('Mijozni arxivlaysizmi? Tarix o‘chmaydi.'))return;try{await api('/api/shop',{action:'customer_archive',customer_id:id});await loadData();renderCustomers();toast('Mijoz arxivlandi')}catch(e){toast(e.message)}}
function renderDebts(){document.getElementById('view').innerHTML='<div class="card"><div class="row"><div class="field"><label>Mijoz</label><select id="dc">'+data.customers.filter(c=>c.status==='active').map(c=>'<option value="'+c.id+'">'+esc(c.full_name)+' — '+money(c.balance)+'</option>').join('')+'</select></div><div class="field"><label>Qarz summasi</label><input id="da" type="number" min="1" placeholder="500000"></div><div class="field"><label>Muddat</label><input id="dd" type="date"></div><div class="field"><label>Izoh</label><input id="dn" placeholder="Tovar, sana..."></div><button class="btn" onclick="createDebt()">+ Qarz</button></div></div><div class="card"><div class="tablewrap"><table class="table"><tr><th>Sana</th><th>Mijoz</th><th>Summa</th><th>Muddat</th><th>Kim</th><th>Status</th></tr>'+data.debts.map(d=>'<tr><td>'+esc(new Date(d.created_at).toLocaleString('uz-UZ'))+'</td><td>'+esc(customerName(d.customer_id))+'</td><td>'+money(d.amount)+'</td><td>'+esc(d.due_date||'—')+'</td><td>'+esc(d.created_by_name)+'</td><td><span class="pill '+(d.status==='active'?'warn':'bad')+'">'+d.status+'</span></td></tr>').join('')+'</table></div></div>'}
async function createDebt(){try{await api('/api/shop',{action:'debt_create',customer_id:document.getElementById('dc').value,amount:document.getElementById('da').value,due_date:document.getElementById('dd').value,note:document.getElementById('dn').value});toast('Qarz qo‘shildi');await loadData();renderDebts()}catch(e){toast(e.message)}}
function renderPayments(){document.getElementById('view').innerHTML='<div class="card"><div class="row"><div class="field"><label>Mijoz</label><select id="pc">'+data.customers.filter(c=>c.status==='active').map(c=>'<option value="'+c.id+'">'+esc(c.full_name)+' — '+money(c.balance)+'</option>').join('')+'</select></div><div class="field"><label>To‘lov summasi</label><input id="pa" type="number" min="1" placeholder="300000"></div><div class="field"><label>Izoh</label><input id="pn" placeholder="Naqd, karta..."></div><button class="btn ok" onclick="createPayment()">+ To‘lov</button></div></div><div class="card"><div class="tablewrap"><table class="table"><tr><th>Sana</th><th>Mijoz</th><th>Summa</th><th>Kim</th><th>Status</th><th></th></tr>'+data.payments.map(p=>'<tr><td>'+esc(new Date(p.created_at).toLocaleString('uz-UZ'))+'</td><td>'+esc(customerName(p.customer_id))+'</td><td>'+money(p.amount)+'</td><td>'+esc(p.created_by_name)+'</td><td><span class="pill '+(p.status==='recorded'?'ok':'bad')+'">'+p.status+'</span></td><td>'+(ctx.member.role==='OWNER'&&p.status==='recorded'?'<button class="btn light" onclick="cancelPayment(\''+p.id+'\')">Bekor qilish</button>':'')+'</td></tr>').join('')+'</table></div></div>'}
async function createPayment(){try{await api('/api/shop',{action:'payment_create',customer_id:document.getElementById('pc').value,amount:document.getElementById('pa').value,note:document.getElementById('pn').value});toast('To‘lov qayd etildi');await loadData();renderPayments()}catch(e){toast(e.message)}}
async function cancelPayment(id){const r=prompt('Bekor qilish sababi:');if(r===null)return;try{await api('/api/shop',{action:'payment_cancel',payment_id:id,reason:r});await loadData();renderPayments();toast('To‘lov bekor qilindi')}catch(e){toast(e.message)}}
function renderSellers(){const ms=data.members.filter(m=>m.role==='SELLER');document.getElementById('view').innerHTML='<div class="card"><h3>Yangi sotuvchi</h3><p class="muted">Sotuvchi shu do‘konning barcha mijozlari, qarzlari va to‘lovlarini ko‘radi. Har bir amal kim bajargani bilan saqlanadi.</p><div class="row"><div class="field"><label>Ism</label><input id="sn" placeholder="Murod"></div><div class="field"><label>Telefon</label><input id="sp" placeholder="+998901234567"></div><button class="btn" onclick="inviteSeller()">Taklif yaratish</button></div></div><div class="card"><div class="tablewrap"><table class="table"><tr><th>Sotuvchi</th><th>Telefon</th><th>Holat</th><th>Auth</th><th></th></tr>'+ms.map(m=>'<tr><td><b>'+esc(m.full_name)+'</b></td><td>'+esc(m.phone)+'</td><td><span class="pill '+(m.status==='active'?'ok':m.status==='pending'?'warn':'bad')+'">'+m.status+'</span></td><td>'+ (m.user_id?'Ulangan':'Kutilmoqda')+'</td><td>'+(m.status==='active'?'<button class="btn bad" onclick="sellerStatus(\''+m.id+'\',\'disabled\')">Faolsizlantirish</button>':'<button class="btn ok" onclick="sellerStatus(\''+m.id+'\',\'active\')">Faollashtirish</button>')+'</td></tr>').join('')+'</table></div></div>'}
async function inviteSeller(){try{await api('/api/shop',{action:'seller_invite',full_name:document.getElementById('sn').value,phone:document.getElementById('sp').value});toast('Sotuvchi taklifi yaratildi');await loadData();renderSellers()}catch(e){toast(e.message)}}
async function sellerStatus(id,status){try{await api('/api/shop',{action:'seller_status',member_id:id,status});await loadData();renderSellers();toast('Status yangilandi')}catch(e){toast(e.message)}}
async function renderActivity(){const logs=await api('/api/shop?action=activity');document.getElementById('view').innerHTML='<div class="card"><h3>Mening faoliyatim</h3><p class="muted">Siz bajargan amallar. Boshqa sellerlar bu bo‘limga kira olmaydi.</p><table class="table"><tr><th>Vaqt</th><th>Amal</th><th>Tur</th><th>ID</th></tr>'+logs.map(x=>'<tr><td>'+esc(new Date(x.created_at).toLocaleString('uz-UZ'))+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.entity_type)+'</td><td style="font-size:11px">'+esc(x.entity_id||'—')+'</td></tr>').join('')+'</table></div>'}
async function renderReports(){try{const r=await api('/api/shop?action=reports');document.getElementById('view').innerHTML='<div class="grid"><div class="stat"><span class="muted">Mijozlar</span><b>'+r.customers+'</b></div><div class="stat"><span class="muted">Faol qarzdorlar</span><b>'+r.active_debtors+'</b></div><div class="stat"><span class="muted">Jami qarz</span><b>'+money(r.debt_total)+'</b></div><div class="stat"><span class="muted">Jami to‘lov</span><b>'+money(r.payment_total)+'</b></div></div><div class="card"><h3>Sotuvchilar faoliyati</h3><table class="table"><tr><th>Sotuvchi</th><th>Qarzlar</th><th>Qarz summasi</th><th>To‘lovlar</th><th>To‘lov summasi</th></tr>'+r.seller_stats.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+x.debts+'</td><td>'+money(x.debt_amount)+'</td><td>'+x.payments+'</td><td>'+money(x.payment_amount)+'</td></tr>').join('')+'</table></div>'}catch(e){toast(e.message)}}
function renderExport(){document.getElementById('view').innerHTML='<div class="card"><h3>Export / Backup</h3><p class="muted">Do‘konning mijozlar, qarzlar, to‘lovlar va sellerlar ma’lumotlarini JSON backup sifatida saqlang.</p><button class="btn" onclick="downloadBackup()">JSON Backup yuklash</button></div>'}
function downloadBackup(){const blob=new Blob([JSON.stringify({exported_at:new Date().toISOString(),shop:ctx.shop,members:data.members,customers:data.customers,debts:data.debts,payments:data.payments},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='qarzniuz-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function renderSettings(){if(ctx.member.role!=='OWNER'){toast('Faqat OWNER');return}document.getElementById('view').innerHTML='<div class="card"><h3>Do‘kon sozlamalari</h3><div class="field"><label>Do‘kon nomi</label><input id="shop-name-setting" value="'+esc(ctx.shop.name)+'"></div><br><button class="btn" onclick="saveShopSettings()">Saqlash</button></div>'}
async function saveShopSettings(){try{const name=document.getElementById('shop-name-setting').value.trim();const shop=await api('/api/shop',{action:'shop_update',name});ctx.shop=shop;document.getElementById('shopmini').innerHTML='<b>'+esc(shop.name)+'</b><br><span style="color:#94a3b8">'+esc(ctx.member.full_name)+' · '+ctx.member.role+'</span>';toast('Do‘kon nomi yangilandi')}catch(e){toast(e.message)}}
async function renderAudit(){try{const logs=await api('/api/shop?action=audit');document.getElementById('view').innerHTML='<div class="card"><p class="muted">Audit tarixi o‘chirilmaydi. Qarz, to‘lov, mijoz va sotuvchi o‘zgarishlari kim va qachon bajargani bilan saqlanadi.</p><div class="tablewrap"><table class="table"><tr><th>Vaqt</th><th>Kim</th><th>Amal</th><th>Entity</th><th>ID</th></tr>'+logs.map(x=>'<tr><td>'+esc(new Date(x.created_at).toLocaleString('uz-UZ'))+'</td><td>'+esc(x.actor_name||'—')+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.entity_type)+'</td><td style="font-size:11px">'+esc(x.entity_id||'—')+'</td></tr>').join('')+'</table></div></div>'}catch(e){toast(e.message)}}
start();
</script>
</body></html>
